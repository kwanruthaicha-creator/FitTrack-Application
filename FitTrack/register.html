
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack | สมัครสมาชิก</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box register-box">

            <h1 class="logo">FitTrack</h1>
            <p class="subtitle">YOUR FITNESS TRACKING SYSTEM</p>

            <h2>สร้างบัญชีใหม่</h2>
            <p class="description">
                สมัครสมาชิกเพื่อเริ่มต้นใช้งาน FitTrack
            </p>

            <form id="registerForm" novalidate>

                <!-- ชื่อ -->
                <label for="fullname">ชื่อ-นามสกุล</label>
                <input
                    type="text"
                    id="fullname"
                    placeholder="กรอกชื่อ-นามสกุล"
                >
                <p class="field-error" id="fullnameError"></p>

                <!-- อีเมล -->
                <label for="email">อีเมล</label>
                <input
                    type="email"
                    id="email"
                    placeholder="กรอกอีเมลของคุณ"
                >
                <p class="field-error" id="emailError"></p>

                <!-- รหัสผ่าน -->
                <label for="password">รหัสผ่าน</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        placeholder="กำหนดรหัสผ่าน"
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="password"
                    >แสดง</button>
                </div>

                <p class="password-hint">
                    รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร
                </p>
                <p class="field-error" id="passwordError"></p>

                <!-- ยืนยันรหัสผ่าน -->
                <label for="confirmPassword">ยืนยันรหัสผ่าน</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="กรอกรหัสผ่านอีกครั้ง"
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="confirmPassword"
                    >แสดง</button>
                </div>

                <p class="field-error" id="confirmPasswordError"></p>

                <button type="submit">
                    สมัครสมาชิก
                </button>

            </form>

            <p class="register-link">
                มีบัญชีอยู่แล้ว?
                <a href="index.html">เข้าสู่ระบบ</a>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
